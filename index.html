
<!DOCTYPE html>
<html lang="en">
<head>

  <title>Yanni Jiang | UX Research</title>
  <style>
    :root {
      --bg: #F8FAFB;
      --text: #252B33;
      --accent: #314E68;

    body {
      margin: 0;

      color: var(--text);
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 850px;
      margin: 0 auto;
      padding: 100px 24px;

    }

    p {
      font-size: 18px;
      line-height: 1.7;
      color: #58636E;
    }

    .label {
      color: var(--accent);
      font-weight: bold;
      letter-spacing: 1px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="label">
      UX RESEARCH · BEHAVIORAL SCIENCE
    </div>

    <h1>Curious minds ask better questions.</h1>

    <p>
      Hi, I'm Yanni — a Psychology PhD candidate
      and UX researcher exploring how people
      think, decide, and behave.

    <p>Welcome to my little corner of the internet.</p>

</html>
